name: sing-box compatibility matrix

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'root/etc/homeproxy_plus/**'
      - 'htdocs/luci-static/resources/view/homeproxy_plus/**'
      - 'tests/generate_client_config_matrix.sh'
      - '.github/workflows/sing-box-compatibility.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - v1.14.0
          - v1.14.4
          - latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout ucode
        uses: actions/checkout@v6
        with:
          repository: ucode-lang/ucode
          ref: be92ebd706339fd4a848b88ee516b1ac4eb62ef8
          path: ucode
      - name: Build ucode
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake pkg-config libjson-c-dev
          cmake -S ucode -B "$RUNNER_TEMP/ucode-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ucode-install"
          cmake --build "$RUNNER_TEMP/ucode-build" --parallel
          cmake --install "$RUNNER_TEMP/ucode-build"
          echo "$RUNNER_TEMP/ucode-install/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ucode-install/lib" >> "$GITHUB_ENV"
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ matrix.version }}"
          if [ "$version" = "latest" ]; then
            version="$(gh release view --repo SagerNet/sing-box --json tagName --jq .tagName)"
          fi
          printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Not a stable semantic version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/sing-box"
          version="${{ steps.release.outputs.version }}"
          asset_version="${version#v}"
          archive_name="sing-box_${asset_version}_openwrt_x86_64.ipk"
          gh release download "${{ steps.release.outputs.version }}" \
            --repo SagerNet/sing-box \
            --pattern "$archive_name" \
            --dir "$RUNNER_TEMP/sing-box"
          archive="$RUNNER_TEMP/sing-box/$archive_name"
          test -s "$archive"
          release_json="$(gh api "repos/SagerNet/sing-box/releases/tags/${{ steps.release.outputs.version }}")"
          expected_digest="$(printf '%s' "$release_json" |
            jq -r --arg name "$archive_name" '.assets[] | select(.name == $name) | .digest' |
            sed 's/^sha256://')"
          test -n "$expected_digest"
          printf '%s  %s\n' "$expected_digest" "$archive" | sha256sum --check
          tar -xOzf "$archive" data.tar.gz |
            tar -xzOf - ./usr/bin/sing-box > "$RUNNER_TEMP/sing-box-bin"
          test -s "$RUNNER_TEMP/sing-box-bin"
          chmod 0755 "$RUNNER_TEMP/sing-box-bin"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run generated configuration matrix
        run: |
          sudo install -m 0755 "$RUNNER_TEMP/sing-box-bin" /usr/bin/sing-box
          /usr/bin/sing-box version
          sh tests/generate_client_config_matrix.sh
