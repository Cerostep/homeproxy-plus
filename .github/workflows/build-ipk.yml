name: Build ipk for HomeProxy-Plus

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'dev'
    paths:
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - '.github/**'
      - '!.github/ISSUE_TEMPLATE/**'

  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'dev'
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'htdocs/**'
      - 'root/**'
      - '.github/**'
      - '!.github/ISSUE_TEMPLATE/**'

  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_arch:
          - aarch64_generic
          - i386_pentium4
          - x86_64

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - name: Checkout apk
        uses: actions/checkout@v6
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Checkout po2lmo
        uses: actions/checkout@v6
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /var/lib/man-db/auto-update
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Build ipk file
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pushd .github
          fakeroot bash build-ipk.sh apk "${{ github.event_name }}" "$TARGET_ARCH" "$RELEASE_TAG"
          fakeroot bash build-ipk.sh ipk "${{ github.event_name }}" "$TARGET_ARCH" "$RELEASE_TAG"
          echo "APK_ASSET_NAME=$(find . -maxdepth 1 -name '*.apk' -printf '%f')" >> $GITHUB_ENV
          echo "IPK_ASSET_NAME=$(find . -maxdepth 1 -name '*.ipk' -printf '%f')" >> $GITHUB_ENV
          popd

      - name: Publishing APK files to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_ASSET_NAME }}
          path: .github/${{ env.APK_ASSET_NAME }}
          archive: true
          compression-level: 0

      - name: Publishing IPK files to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IPK_ASSET_NAME }}
          path: .github/${{ env.IPK_ASSET_NAME }}
          archive: true
          compression-level: 0

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - name: Checkout usign
        uses: actions/checkout@v6
        with:
          repository: openwrt/usign
          ref: c4c72b1b07945ee192361dc751291a7c98d6adcd
          path: usign

      - name: Build usign
        run: |
          cmake -S usign -B usign/build -DCMAKE_BUILD_TYPE=Release
          cmake --build usign/build --parallel
          sudo install -m0755 usign/build/usign /usr/local/bin/usign

      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: luci-app-homeproxy-plus_*
          merge-multiple: true

      - name: Generate opkg feed index
        run: bash .github/create-ipk-feed-index.sh .

      - name: Sign opkg feed index
        env:
          USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$USIGN_SECRET_KEY" ]; then
            echo "GitHub Actions secret USIGN_SECRET_KEY is required to publish the IPK feed." >&2
            exit 1
          fi
          signing_key="$RUNNER_TEMP/homeproxy-plus-feed-secret.key"
          umask 077
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$USIGN_SECRET_KEY" > "$signing_key"
          unset USIGN_SECRET_KEY
          bash .github/sign-ipk-feed.sh \
            "$signing_key" .github/homeproxy-plus-feed.pub .

      - name: Publishing to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: luci-app-homeproxy-plus_*.*
          file_glob: true
          tag: ${{ github.ref }}

      - name: Publishing signed opkg feed index
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: Packages.*
          file_glob: true
          tag: ${{ github.ref }}

      - name: Publishing opkg feed public key
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: .github/homeproxy-plus-feed.pub
          asset_name: homeproxy-plus-feed.pub
          tag: ${{ github.ref }}
