name: Test HomeProxy-Plus

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/build-ipk.sh'
      - '.github/package-version.sh'
      - 'root/**'
      - 'htdocs/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '.github/build-ipk.sh'
      - '.github/package-version.sh'
      - 'root/**'
      - 'htdocs/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate package identity and scripts
        run: sh tests/package_identity.sh
      - name: Test existing local route detection
        run: sh tests/service_network_routes.sh
      - name: Test release package version mapping
        run: bash tests/package_version.sh
      - name: Test standalone package metadata
        run: bash tests/package_build_metadata.sh
